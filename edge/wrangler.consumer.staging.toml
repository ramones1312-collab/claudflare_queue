# STAGING ONLY. Every resource name carries the -stg suffix so nothing here can touch a PROD
# queue, Worker or Durable Object namespace. The DO namespace is derived from the Worker
# name, so kawa-edge-ingress-stg has its own storage, separate from production.
#
# The KAWA receiver must be a STAGING or mock endpoint. STAGING must have NO route capable of
# placing a real order: never point KAWA_WEBHOOK_URL at vector-hook.integrademia.com.
# KAWA VECTOR · Edge Signal Buffer — DELIVERY CONSUMER · SINGLE-DESTINATION (V1.2.3 COMPATIBILITY)
#
# V1.3.0 keeps this path working unchanged: with no DESTINATIONS var the registry yields exactly one
# destination wired to these V1.2.3 bindings (SIGNAL_QUEUE / DLQ / KAWA_WEBHOOK_URL / KAWA_FETCHER),
# and the behaviour is identical to V1.2.3. For multi-destination use the per-destination files
# instead: wrangler.consumer.hub-a.staging.toml and wrangler.consumer.hub-b.staging.toml.
name = "kawa-edge-delivery-stg"
main = "src/consumer-entry.js"
compatibility_date = "2024-12-18"

# Binds the sequencer defined in the ingress Worker. The class is declared there, not here.
[[durable_objects.bindings]]
name = "SEQUENCER"
class_name = "EdgeSequencer"
script_name = "kawa-edge-ingress-stg"

[[queues.consumers]]
queue = "kawa-signal-buffer-stg"
max_batch_size = 1
max_batch_timeout = 0
# High, because a message waiting its turn behind an earlier sequence retries legitimately and must
# not be mistaken for a failure. Transport exhaustion is NOT a causal halt: if a copy is discarded,
# the DO's redispatch lease republishes the same edge_seq.
max_retries = 100
# Deliberately NO dead_letter_queue here: our DLQ means one thing only -- a permanent 4xx from KAWA,
# written by the consumer and followed by a durable HALTED_DLQ. Routing retry exhaustion into the
# same queue would manufacture false causal halts out of ordinary WAITs.
max_concurrency = 1

[[queues.producers]]
queue = "kawa-signal-buffer-dlq-stg"
binding = "DLQ"

# STAGING HARD-LOCK. Delivery is bound to the staging receiver Worker, so it is structurally
# impossible for this consumer to reach any other host -- including a production one. It does not
# depend on an operator typing a URL correctly.
#
# KAWA_WEBHOOK_URL is NOT a secret here: the Service Binding decides the destination. The value below
# only supplies a syntactically valid URL for building the Request object; its host is never dialled.
[[services]]
binding = "KAWA_FETCHER"
service = "kawa-staging-receiver"

[vars]
KAWA_WEBHOOK_URL = "https://staging-receiver.invalid/webhook/stg"
DELIVERY_TIMEOUT_MS = "10000"
