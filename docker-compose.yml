# KAWA VECTOR · Edge Signal Buffer · NAS DEPLOYER
#
#   sudo ./kawa-edge install          (recommended: the launcher sets the user and builds once)
#   sudo docker compose run --rm installer install     (equivalent, by hand)
#
# Isolation from HUB_A, by construction: no ports, its OWN project network (not Docker's shared default
# bridge, so no other container sits on its network; the deployer never connects to the NAS or its
# published ports — it only calls api.cloudflare.com and *.workers.dev),
# not privileged, all capabilities dropped, read-only root filesystem, no volume shared with any
# other container. Only three folders of THIS package are mounted.
name: kawa-edge-deployer

services:
  installer:
    build:
      context: .
      dockerfile: Dockerfile
    image: kawa-edge-deployer:1.3.1-nas-r3.1
    # The launcher sets these to the owner of this folder, so state/ stays writable and readable
    # by you on the NAS. Default 1000 when started some other way.
    user: "${KAWA_UID:-1000}:${KAWA_GID:-1000}"
    command: ["${KAWA_COMMAND:-help}"]
    networks: [deployer]
    privileged: false
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    stdin_open: true
    tty: true
    environment:
      HOME: /tmp/home
      KAWA_RUNTIME: /run/kawa
      KAWA_BUILD: /tmp/kawa-build
      # Set to 1 in .env when starting from the Container Manager UI (no keyboard): optional prompts
      # are skipped and mandatory ones fail with NO_TTY instead of waiting forever.
      KAWA_NONINTERACTIVE: ${KAWA_NONINTERACTIVE:-}
    tmpfs:
      # Temporary secret files live here for seconds and are shredded; RAM only, never on disk.
      - /run/kawa:uid=${KAWA_UID:-1000},gid=${KAWA_GID:-1000},mode=0700,size=16m
      - /tmp:mode=1777,size=1536m
    volumes:
      - ./config:/opt/kawa/config
      - ./state:/opt/kawa/state
      - ./secrets:/opt/kawa/secrets

networks:
  deployer: {}
